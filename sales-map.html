<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영업 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
            background: #fff;
            color: #000;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 320px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 24px 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #000;
            letter-spacing: -0.3px;
        }

        .header-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 16px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats-inline {
            display: flex;
            gap: 12px;
            font-size: 13px;
            color: #666;
        }

        .stat-inline {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .visit-rate {
            font-size: 13px;
            color: #000;
            font-weight: 600;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            padding: 6px 10px;
            background: #fff;
            color: #000;
            border: 1px solid #e0e0e0;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            border-color: #FEE500;
            color: #FEE500;
        }

        .add-btn {
            padding: 6px 12px;
            background: #FEE500;
            color: #000;
            border: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .add-btn:hover {
            opacity: 0.8;
        }

        .filters {
            padding: 12px 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid #e0e0e0;
            background: #fff;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: #666;
        }

        .filter-btn:hover {
            border-color: #FEE500;
            color: #000;
        }

        .filter-btn.active {
            background: #FEE500;
            border-color: #FEE500;
            color: #000;
            font-weight: 600;
        }

        .locations {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .location-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            padding: 16px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
        }

        .location-card:hover {
            border-color: #FEE500;
        }

        .location-card.active {
            background: #FFFBEA;
            border-color: #FEE500;
        }

        .location-card.visited {
            border-color: #FEE500;
            opacity: 0.6;
        }

        .card-actions {
            position: absolute;
            top: 12px;
            right: 12px;
            display: none;
            gap: 8px;
        }

        .location-card:hover .card-actions {
            display: flex;
        }

        .card-btn {
            width: 24px;
            height: 24px;
            border: 1px solid #e0e0e0;
            background: #fff;
            color: #666;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .card-btn:hover {
            border-color: #FEE500;
            color: #000;
        }

        .location-header {
            margin-bottom: 12px;
        }

        .location-name {
            font-size: 14px;
            font-weight: 600;
            color: #000;
            margin-bottom: 2px;
        }

        .location-company {
            font-size: 11px;
            color: #999;
        }

        .visit-badge {
            font-size: 10px;
            font-weight: 500;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        .location-info {
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }

        .location-info div {
            margin-bottom: 3px;
            display: flex;
            align-items: start;
            gap: 6px;
        }

        .location-info .label {
            min-width: 60px;
            color: #999;
        }

        .map-container {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* 모달 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #fff;
            width: 450px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 16px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #999;
            padding: 0;
            width: 24px;
            height: 24px;
        }

        .modal-close:hover {
            color: #000;
        }

        .modal-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #666;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #e0e0e0;
            font-size: 13px;
            background: #fff;
            color: #000;
        }

        .form-group input:focus {
            outline: none;
            border-color: #FEE500;
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .btn {
            padding: 10px 20px;
            border: 1px solid #e0e0e0;
            background: #fff;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            border-color: #FEE500;
        }

        .btn-primary {
            background: #FEE500;
            border-color: #FEE500;
            color: #000;
            font-weight: 600;
        }

        .btn-primary:hover {
            opacity: 0.8;
        }

        /* 커스텀 필드 */
        .custom-fields-list {
            margin-top: 20px;
            border-top: 1px solid #e0e0e0;
            padding-top: 20px;
        }

        .custom-fields-list h3 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #000;
        }

        .custom-field-item {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }

        .custom-field-item input {
            flex: 1;
            padding: 8px;
            border: 1px solid #e0e0e0;
            font-size: 12px;
        }

        .custom-field-item input:focus {
            outline: none;
            border-color: #FEE500;
        }

        .custom-field-remove {
            padding: 8px 12px;
            background: #fff;
            border: 1px solid #e0e0e0;
            font-size: 11px;
            cursor: pointer;
            color: #999;
        }

        .custom-field-remove:hover {
            border-color: #FEE500;
            color: #000;
        }

        .add-field-btn {
            padding: 8px;
            width: 100%;
            background: #f5f5f5;
            border: 1px dashed #e0e0e0;
            font-size: 12px;
            cursor: pointer;
            color: #666;
        }

        .add-field-btn:hover {
            border-color: #FEE500;
            color: #000;
        }

        /* 커스텀 마커 */
        .custom-marker {
            background: #FEE500;
            width: 24px;
            height: 24px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .custom-marker.visited {
            background: #FEE500;
            opacity: 0.4;
        }

        .custom-marker-inner {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(45deg);
            color: #000;
            font-size: 11px;
            font-weight: bold;
        }

        /* 팝업 스타일 */
        .leaflet-popup-content-wrapper {
            background: #fff;
            border: 1px solid #FEE500;
            border-radius: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .leaflet-popup-tip {
            background: #fff;
            border: 1px solid #FEE500;
            border-top: none;
            border-right: none;
        }

        .popup-content {
            min-width: 240px;
            padding: 4px;
        }

        .popup-title {
            font-size: 14px;
            font-weight: 600;
            color: #000;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e0e0e0;
        }

        .popup-info {
            font-size: 11px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .popup-info div {
            margin-bottom: 4px;
            display: flex;
            gap: 6px;
        }

        .popup-info .label {
            min-width: 60px;
            color: #999;
        }

        .popup-info a {
            color: #000;
            text-decoration: none;
            border-bottom: 1px solid #e0e0e0;
        }

        .popup-info a:hover {
            border-bottom-color: #FEE500;
        }

        .popup-action {
            padding-top: 8px;
            border-top: 1px solid #e0e0e0;
        }

        .popup-btn {
            width: 100%;
            padding: 8px;
            background: #FEE500;
            color: #000;
            border: none;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .popup-btn:hover {
            opacity: 0.8;
        }

        .popup-btn.visited {
            background: #fff;
            color: #000;
            border: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="header">
                <h1>영업 지도</h1>
                <div class="header-actions">
                    <div class="stats-row">
                        <div class="stats-inline">
                            <div class="stat-inline">
                                전체 <span id="totalCount">0</span>
                            </div>
                            <div class="stat-inline">
                                방문 <span id="visitedCount">0</span>
                            </div>
                            <div class="stat-inline">
                                미방문 <span id="notVisitedCount">0</span>
                            </div>
                        </div>
                    </div>
                    <div class="stats-row">
                        <div class="visit-rate">
                            방문율 <span id="visitRate">0</span>%
                        </div>
                        <div class="header-buttons">
                            <button class="icon-btn" onclick="openFieldsModal()" title="컬럼 관리">수정</button>
                            <button class="add-btn" onclick="openAddModal()">추가</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="filters">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">전체</button>
                    <button class="filter-btn" data-filter="visited">방문</button>
                    <button class="filter-btn" data-filter="not-visited">미방문</button>
                    <button class="filter-btn" id="viewportBtn" onclick="toggleViewportFilter()">📍 영역</button>
                </div>
            </div>

            <div class="locations" id="locationList"></div>
        </div>

        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>

    <!-- 업체 추가/수정 모달 -->
    <div class="modal" id="locationModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">업체 추가</h2>
                <button class="modal-close" onclick="closeLocationModal()">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editingId">
                <div class="form-group">
                    <label>업체명 *</label>
                    <input type="text" id="inputName" required>
                </div>
                <div class="form-group">
                    <label>회사명</label>
                    <input type="text" id="inputCompany">
                </div>
                <div class="form-group">
                    <label>사업자번호</label>
                    <input type="text" id="inputBusinessNo">
                </div>
                <div class="form-group">
                    <label>주소 *</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="inputAddress" required style="flex: 1;">
                        <button type="button" class="btn" onclick="searchCoordinates()" style="white-space: nowrap; padding: 10px 16px;">좌표 찾기</button>
                    </div>
                    <div id="geocodeStatus" style="font-size: 11px; color: #999; margin-top: 4px;"></div>
                </div>
                <div class="form-group">
                    <label>전화번호</label>
                    <input type="text" id="inputPhone">
                </div>
                <div class="form-group">
                    <label>이메일</label>
                    <input type="email" id="inputEmail">
                </div>
                <div class="form-group">
                    <label>홈페이지</label>
                    <input type="url" id="inputWebsite">
                </div>
                <div class="form-group">
                    <label>위도 (Latitude) *</label>
                    <input type="number" step="0.0001" id="inputLat" required>
                </div>
                <div class="form-group">
                    <label>경도 (Longitude) *</label>
                    <input type="number" step="0.0001" id="inputLng" required>
                </div>
                <div id="customFieldsInputs"></div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeLocationModal()">취소</button>
                <button class="btn btn-primary" onclick="saveLocation()">저장</button>
            </div>
        </div>
    </div>

    <!-- 컬럼 관리 모달 -->
    <div class="modal" id="fieldsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>컬럼 관리</h2>
                <button class="modal-close" onclick="closeFieldsModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="custom-fields-list">
                    <h3>커스텀 필드</h3>
                    <div id="customFieldsList"></div>
                    <button class="add-field-btn" onclick="addCustomField()">+ 필드 추가</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="saveCustomFields()">저장</button>
            </div>
        </div>
    </div>

    <script>
        let locations = [
            {
                id: 1,
                name: '스텝온리(STAFF ONLY)',
                businessNo: '382-16-00204',
                address: '서울 노원구 공릉로42길 13-14 지하1층',
                phone: '070-8861-8129',
                email: 'staffonlyofficial@gmail.com',
                website: 'https://www.staffonly.kr',
                lat: 37.6259,
                lng: 127.0718,
                customData: {}
            },
            {
                id: 2,
                name: '벤셔먼',
                company: '주식회사 레몬트리커머스',
                businessNo: '105-87-05811',
                address: '서울 금천구 가산디지털1로 196 7층 705호',
                phone: '070-8290-4062',
                email: 'nania7908@nate.com',
                website: 'https://www.bensherman.co.kr',
                lat: 37.4816,
                lng: 126.8819,
                customData: {}
            },
            {
                id: 3,
                name: '더블유브이프로젝트',
                company: '주식회사 에프엠제이인터내셔날',
                businessNo: '631-87-00028',
                address: '서울특별시 동대문구 사가정로 27길 4, 비동 3층 01호',
                phone: '1644-1429',
                email: 'drtrtdes12@fairplay142.com',
                website: 'https://www.wvproject.com',
                lat: 37.5897,
                lng: 127.0516,
                customData: {}
            },
            {
                id: 4,
                name: '드파운드',
                company: '주식회사 디피컴퍼니',
                businessNo: '379-86-03004',
                address: '서울 성동구 아차산로17길 48 (성수 SK V1 CENTER I) 1004호',
                phone: '070-4848-3226',
                email: 'cs@dpcompany.co.kr',
                website: 'https://www.dfound.co.kr',
                lat: 37.5443,
                lng: 127.0557,
                customData: {}
            }
        ];

        let customFields = [];
        let map;
        let markers = {};
        let currentFilter = 'all';
        let viewportFilter = false; // 지도 영역 필터
        let nextId = 5;
        let editingLocationId = null;

        // localStorage 관리
        function saveData() {
            localStorage.setItem('salesLocations', JSON.stringify(locations));
            localStorage.setItem('customFields', JSON.stringify(customFields));
        }

        function loadData() {
            const savedLocations = localStorage.getItem('salesLocations');
            const savedFields = localStorage.getItem('customFields');
            
            if (savedLocations) {
                locations = JSON.parse(savedLocations);
                nextId = Math.max(...locations.map(l => l.id)) + 1;
            }
            
            if (savedFields) {
                customFields = JSON.parse(savedFields);
            }
        }

        function getVisitedStatus() {
            const visited = localStorage.getItem('visitedLocations');
            return visited ? JSON.parse(visited) : {};
        }

        function setVisitedStatus(locationId, isVisited) {
            const visited = getVisitedStatus();
            visited[locationId] = isVisited;
            localStorage.setItem('visitedLocations', JSON.stringify(visited));
            updateStats();
            renderLocations();
            updateMarkers();
        }

        function updateStats() {
            const visited = getVisitedStatus();
            const visitedCount = Object.values(visited).filter(v => v).length;
            const total = locations.length;
            const rate = total > 0 ? Math.round((visitedCount / total) * 100) : 0;
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('visitedCount').textContent = visitedCount;
            document.getElementById('notVisitedCount').textContent = total - visitedCount;
            document.getElementById('visitRate').textContent = rate;
        }

        function renderLocations() {
            const visited = getVisitedStatus();
            const container = document.getElementById('locationList');
            
            let filteredLocations = locations.filter(loc => {
                // 방문 상태 필터
                if (currentFilter === 'visited' && !visited[loc.id]) return false;
                if (currentFilter === 'not-visited' && visited[loc.id]) return false;
                
                // 지도 영역 필터
                if (viewportFilter && map) {
                    const bounds = map.getBounds();
                    const latlng = L.latLng(loc.lat, loc.lng);
                    if (!bounds.contains(latlng)) return false;
                }
                
                return true;
            });

            container.innerHTML = filteredLocations.map(loc => {
                const isVisited = visited[loc.id];
                
                let customFieldsHtml = '';
                customFields.forEach(field => {
                    const value = loc.customData[field.key] || '';
                    if (value) {
                        customFieldsHtml += `<div><span class="label">${field.label}</span><span>${value}</span></div>`;
                    }
                });
                
                return `
                    <div class="location-card ${isVisited ? 'visited' : ''}" data-id="${loc.id}">
                        <div class="card-actions">
                            <button class="card-btn" onclick="openEditModal(${loc.id}, event)" title="수정">✎</button>
                            <button class="card-btn" onclick="deleteLocation(${loc.id}, event)" title="삭제">×</button>
                        </div>
                        <div class="location-header">
                            <div class="location-name">${loc.name}</div>
                            ${loc.company ? `<div class="location-company">${loc.company}</div>` : ''}
                            <div class="visit-badge">${isVisited ? 'visited' : ''}</div>
                        </div>
                        <div class="location-info">
                            <div><span class="label">주소</span><span>${loc.address}</span></div>
                            ${loc.phone ? `<div><span class="label">전화</span><span>${loc.phone}</span></div>` : ''}
                            ${loc.email ? `<div><span class="label">이메일</span><span>${loc.email}</span></div>` : ''}
                            ${customFieldsHtml}
                        </div>
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.location-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (!e.target.closest('.card-btn')) {
                        document.querySelectorAll('.location-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');
                        const id = parseInt(card.dataset.id);
                        focusLocation(id);
                    }
                });
            });
        }

        function toggleVisit(id) {
            const visited = getVisitedStatus();
            setVisitedStatus(id, !visited[id]);
        }

        function toggleViewportFilter() {
            viewportFilter = !viewportFilter;
            const btn = document.getElementById('viewportBtn');
            if (viewportFilter) {
                btn.style.background = '#FEE500';
                btn.style.color = '#000';
                btn.style.fontWeight = '600';
            } else {
                btn.style.background = '#fff';
                btn.style.color = '#666';
                btn.style.fontWeight = '500';
            }
            renderLocations();
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderLocations();
            });
        });

        function initMap() {
            map = L.map('map').setView([37.5665, 126.9780], 13);

            // 구글맵 스타일 베이스맵 (지하철 정보 포함)
            L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                attribution: '© Google Maps',
                maxZoom: 20
            }).addTo(map);

            // 지도 이동/줌 변경시 리스트 업데이트
            map.on('moveend', function() {
                if (viewportFilter) {
                    renderLocations();
                }
            });

            updateAllMarkers();
        }

        function updateAllMarkers() {
            Object.values(markers).forEach(marker => marker.remove());
            markers = {};

            const visited = getVisitedStatus();
            locations.forEach(location => {
                const isVisited = visited[location.id];
                
                const customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="custom-marker ${isVisited ? 'visited' : ''}">
                             <div class="custom-marker-inner">${isVisited ? '✓' : ''}</div>
                           </div>`,
                    iconSize: [24, 24],
                    iconAnchor: [12, 24],
                    popupAnchor: [0, -24]
                });

                const marker = L.marker([location.lat, location.lng], {
                    icon: customIcon
                }).addTo(map);

                let customFieldsHtml = '';
                customFields.forEach(field => {
                    const value = location.customData[field.key] || '';
                    if (value) {
                        customFieldsHtml += `<div><span class="label">${field.label}</span><span>${value}</span></div>`;
                    }
                });

                const popupContent = `
                    <div class="popup-content">
                        <div class="popup-title">${location.name}</div>
                        <div class="popup-info">
                            ${location.company ? `<div><span class="label">회사</span><span>${location.company}</span></div>` : ''}
                            <div><span class="label">주소</span><span>${location.address}</span></div>
                            ${location.phone ? `<div><span class="label">전화</span><span><a href="tel:${location.phone}">${location.phone}</a></span></div>` : ''}
                            ${location.email ? `<div><span class="label">이메일</span><span><a href="mailto:${location.email}">${location.email}</a></span></div>` : ''}
                            ${location.website ? `<div><span class="label">홈페이지</span><span><a href="${location.website}" target="_blank">${location.website}</a></span></div>` : ''}
                            ${customFieldsHtml}
                        </div>
                        <div class="popup-action">
                            <button class="popup-btn ${isVisited ? 'visited' : ''}" onclick="toggleVisitFromPopup(${location.id})">
                                ${isVisited ? '미방문으로 변경' : '방문완료'}
                            </button>
                        </div>
                    </div>
                `;

                marker.bindPopup(popupContent);
                markers[location.id] = marker;
            });
        }

        function updateMarkers() {
            updateAllMarkers();
        }

        function focusLocation(id) {
            const location = locations.find(l => l.id === id);
            const marker = markers[id];
            
            if (location && marker && map) {
                map.setView([location.lat, location.lng], 16, {
                    animate: true,
                    duration: 0.5
                });
                
                setTimeout(() => {
                    marker.openPopup();
                }, 300);
            }
        }

        function toggleVisitFromPopup(id) {
            toggleVisit(id);
            updateAllMarkers();
            focusLocation(id);
        }

        // 주소로 좌표 검색
        async function searchCoordinates() {
            const address = document.getElementById('inputAddress').value.trim();
            const statusDiv = document.getElementById('geocodeStatus');
            
            if (!address) {
                statusDiv.textContent = '주소를 입력해주세요.';
                statusDiv.style.color = '#dc3545';
                return;
            }
            
            statusDiv.textContent = '검색 중...';
            statusDiv.style.color = '#999';
            
            // 주소 정리 패턴들 (우선순위 순)
            const addressVariations = [];
            
            // 1. 원본 주소
            addressVariations.push(address);
            
            // 2. 모든 괄호 및 괄호 안 내용 제거
            let cleaned = address.replace(/\([^)]*\)/g, '').replace(/\s+/g, ' ').trim();
            if (cleaned && cleaned !== address) {
                addressVariations.push(cleaned);
            }
            
            // 3. 첫 번째 괄호 이전까지만
            const beforeParen = address.split('(')[0].trim();
            if (beforeParen && beforeParen !== address && !addressVariations.includes(beforeParen)) {
                addressVariations.push(beforeParen);
            }
            
            // 4. "도로명 + 번지수"까지만 (예: 서울 광진구 자양로 217)
            const roadMatch = address.match(/^(.*?[로길]\s*\d+)/);
            if (roadMatch && !addressVariations.includes(roadMatch[1].trim())) {
                addressVariations.push(roadMatch[1].trim());
            }
            
            // 5. 건물명 제거 (빌딩, 타워, 센터 등)
            cleaned = address.replace(/\s+[가-힣]+(?:빌딩|타워|센터|아파트|맨션|빌라|오피스텔|프라자|스퀘어)[^\s]*/gi, '').trim();
            if (cleaned && cleaned !== address && !addressVariations.includes(cleaned)) {
                addressVariations.push(cleaned);
            }
            
            // 6. 층수 정보 제거
            cleaned = address.replace(/\s+\d+층.*$/g, '').replace(/\s+B?\d+F.*$/gi, '').trim();
            if (cleaned && cleaned !== address && !addressVariations.includes(cleaned)) {
                addressVariations.push(cleaned);
            }
            
            // 7. 호수 정보 제거
            cleaned = address.replace(/\s+\d+호.*$/g, '').trim();
            if (cleaned && cleaned !== address && !addressVariations.includes(cleaned)) {
                addressVariations.push(cleaned);
            }
            
            // 각 주소 패턴으로 시도
            for (let i = 0; i < addressVariations.length; i++) {
                const tryAddress = addressVariations[i];
                
                if (i > 0) {
                    statusDiv.textContent = `검색 중... (${i + 1}/${addressVariations.length})`;
                }
                
                try {
                    const response = await fetch(
                        `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(tryAddress + ', 대한민국')}&format=json&limit=1&countrycodes=kr`,
                        {
                            headers: {
                                'Accept-Language': 'ko'
                            }
                        }
                    );
                    
                    const data = await response.json();
                    
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lng = parseFloat(data[0].lon);
                        
                        document.getElementById('inputLat').value = lat.toFixed(4);
                        document.getElementById('inputLng').value = lng.toFixed(4);
                        
                        statusDiv.textContent = i === 0 
                            ? '✓ 좌표를 찾았습니다!' 
                            : `✓ 좌표를 찾았습니다! (검색어: ${tryAddress})`;
                        statusDiv.style.color = '#28a745';
                        return; // 성공하면 종료
                    }
                    
                    // API 요청 간격 (rate limit 방지)
                    if (i < addressVariations.length - 1) {
                        await new Promise(resolve => setTimeout(resolve, 600));
                    }
                } catch (error) {
                    // 오류 무시하고 다음 패턴 시도
                }
            }
            
            // 모든 시도 실패
            statusDiv.textContent = '주소를 찾을 수 없습니다. 좌표를 직접 입력해주세요.';
            statusDiv.style.color = '#dc3545';
        }

        // 업체 추가/수정 모달
        function openAddModal() {
            editingLocationId = null;
            document.getElementById('modalTitle').textContent = '업체 추가';
            clearLocationForm();
            renderCustomFieldInputs();
            document.getElementById('locationModal').classList.add('active');
        }

        function openEditModal(id, event) {
            event.stopPropagation();
            editingLocationId = id;
            const location = locations.find(l => l.id === id);
            
            if (!location) return;
            
            document.getElementById('modalTitle').textContent = '업체 수정';
            document.getElementById('inputName').value = location.name || '';
            document.getElementById('inputCompany').value = location.company || '';
            document.getElementById('inputBusinessNo').value = location.businessNo || '';
            document.getElementById('inputAddress').value = location.address || '';
            document.getElementById('inputPhone').value = location.phone || '';
            document.getElementById('inputEmail').value = location.email || '';
            document.getElementById('inputWebsite').value = location.website || '';
            document.getElementById('inputLat').value = location.lat || '';
            document.getElementById('inputLng').value = location.lng || '';
            
            renderCustomFieldInputs(location.customData);
            document.getElementById('locationModal').classList.add('active');
        }

        function closeLocationModal() {
            document.getElementById('locationModal').classList.remove('active');
            clearLocationForm();
        }

        function clearLocationForm() {
            document.getElementById('inputName').value = '';
            document.getElementById('inputCompany').value = '';
            document.getElementById('inputBusinessNo').value = '';
            document.getElementById('inputAddress').value = '';
            document.getElementById('inputPhone').value = '';
            document.getElementById('inputEmail').value = '';
            document.getElementById('inputWebsite').value = '';
            document.getElementById('inputLat').value = '';
            document.getElementById('inputLng').value = '';
        }

        function renderCustomFieldInputs(data = {}) {
            const container = document.getElementById('customFieldsInputs');
            container.innerHTML = customFields.map(field => `
                <div class="form-group">
                    <label>${field.label}</label>
                    <input type="text" id="custom_${field.key}" value="${data[field.key] || ''}">
                </div>
            `).join('');
        }

        function saveLocation() {
            const name = document.getElementById('inputName').value.trim();
            const address = document.getElementById('inputAddress').value.trim();
            const lat = parseFloat(document.getElementById('inputLat').value);
            const lng = parseFloat(document.getElementById('inputLng').value);

            if (!name || !address || isNaN(lat) || isNaN(lng)) {
                alert('필수 항목을 모두 입력해주세요.');
                return;
            }

            const customData = {};
            customFields.forEach(field => {
                const value = document.getElementById(`custom_${field.key}`).value.trim();
                if (value) customData[field.key] = value;
            });

            const locationData = {
                name: name,
                company: document.getElementById('inputCompany').value.trim(),
                businessNo: document.getElementById('inputBusinessNo').value.trim(),
                address: address,
                phone: document.getElementById('inputPhone').value.trim(),
                email: document.getElementById('inputEmail').value.trim(),
                website: document.getElementById('inputWebsite').value.trim(),
                lat: lat,
                lng: lng,
                customData: customData
            };

            if (editingLocationId) {
                const index = locations.findIndex(l => l.id === editingLocationId);
                if (index !== -1) {
                    locations[index] = { ...locations[index], ...locationData };
                }
            } else {
                locations.push({ id: nextId++, ...locationData });
            }

            saveData();
            updateStats();
            renderLocations();
            updateAllMarkers();
            closeLocationModal();
        }

        function deleteLocation(id, event) {
            event.stopPropagation();
            if (confirm('이 업체를 삭제하시겠습니까?')) {
                locations = locations.filter(l => l.id !== id);
                
                const visited = getVisitedStatus();
                delete visited[id];
                localStorage.setItem('visitedLocations', JSON.stringify(visited));
                
                saveData();
                updateStats();
                renderLocations();
                updateAllMarkers();
            }
        }

        // 컬럼 관리 모달
        function openFieldsModal() {
            renderCustomFieldsList();
            document.getElementById('fieldsModal').classList.add('active');
        }

        function closeFieldsModal() {
            document.getElementById('fieldsModal').classList.remove('active');
        }

        function renderCustomFieldsList() {
            const container = document.getElementById('customFieldsList');
            container.innerHTML = customFields.map((field, index) => `
                <div class="custom-field-item">
                    <input type="text" value="${field.label}" 
                           onchange="updateFieldLabel(${index}, this.value)"
                           placeholder="필드명">
                    <button class="custom-field-remove" onclick="removeCustomField(${index})">삭제</button>
                </div>
            `).join('');
        }

        function addCustomField() {
            const key = 'field_' + Date.now();
            customFields.push({ key: key, label: '새 필드' });
            renderCustomFieldsList();
        }

        function updateFieldLabel(index, label) {
            if (customFields[index]) {
                customFields[index].label = label;
            }
        }

        function removeCustomField(index) {
            if (confirm('이 필드를 삭제하시겠습니까?')) {
                const field = customFields[index];
                customFields.splice(index, 1);
                
                locations.forEach(loc => {
                    if (loc.customData && loc.customData[field.key]) {
                        delete loc.customData[field.key];
                    }
                });
                
                renderCustomFieldsList();
            }
        }

        function saveCustomFields() {
            saveData();
            renderLocations();
            updateAllMarkers();
            closeFieldsModal();
        }

        // 초기화
        window.onload = () => {
            loadData();
            updateStats();
            renderLocations();
            initMap();
        };

        // 모달 외부 클릭시 닫기
        document.getElementById('locationModal').addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) {
                closeLocationModal();
            }
        });

        document.getElementById('fieldsModal').addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) {
                closeFieldsModal();
            }
        });
    </script>
</body>
</html>
