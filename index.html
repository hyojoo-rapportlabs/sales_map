<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영업 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
            font-weight: 500;
            background: #fff;
            color: #121212;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 320px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 24px 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #121212;
            letter-spacing: -0.3px;
        }

        .header-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 16px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats-inline {
            display: flex;
            gap: 12px;
            font-size: 13px;
            color: #666;
        }

        .stat-inline {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .visit-rate {
            font-size: 13px;
            color: #121212;
            font-weight: 600;
        }

        .header-buttons {
            display: flex;
            gap: 12px;
        }

        .text-btn {
            font-size: 13px;
            color: #999;
            cursor: pointer;
        }

        .text-btn:hover {
            color: #121212;
        }

        .icon-btn {
            padding: 6px 10px;
            background: #fff;
            color: #121212;
            border: 1px solid #e0e0e0;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            border-color: #FEE500;
            color: #FEE500;
        }

        .add-btn {
            padding: 6px 12px;
            background: #FEE500;
            color: #121212;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .add-btn:hover {
            opacity: 0.8;
        }

        .filters {
            padding: 12px 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid #e0e0e0;
            background: #fff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: #666;
        }

        .filter-btn:hover {
            border-color: #FEE500;
            color: #121212;
        }

        .filter-btn.active {
            background: #FEE500;
            border-color: #FEE500;
            color: #121212;
            font-weight: 600;
        }

        .search-box {
            margin-top: 10px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            font-size: 13px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #FEE500;
        }

        .locations {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .location-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            padding: 12px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
        }

        .location-card:hover {
            border-color: #FEE500;
        }

        .location-card.active {
            background: #FFFBEA;
            border-color: #FEE500;
        }

        .location-card.visited {
            border-color: #FEE500;
            opacity: 0.6;
        }

        .card-actions {
            position: absolute;
            top: 12px;
            right: 12px;
            display: none;
            gap: 8px;
        }

        .location-card:hover .card-actions {
            display: flex;
        }

        .card-btn {
            width: 24px;
            height: 24px;
            border: 1px solid #e0e0e0;
            background: #fff;
            color: #666;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .card-btn:hover {
            border-color: #FEE500;
            color: #121212;
        }

        .location-header {
            margin-bottom: 8px;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .location-name {
            font-size: 13px;
            font-weight: 600;
            color: #121212;
        }

        .location-company {
            font-size: 13px;
            color: #aaa;
            font-weight: 500;
        }

        .visit-badge {
            font-size: 13px;
            font-weight: 500;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        .location-info {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        .location-info div {
            margin-bottom: 2px;
            display: flex;
            align-items: start;
            gap: 6px;
        }

        .location-info .label {
            min-width: 50px;
            color: #999;
        }

        .map-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* 모달 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #fff;
            width: 500px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .modal-header h2 {
            font-size: 16px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #999;
            padding: 0;
            width: 24px;
            height: 24px;
        }

        .modal-close:hover {
            color: #121212;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #666;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #e0e0e0;
            font-size: 13px;
            background: #fff;
            color: #121212;
        }

        .form-group input:focus {
            outline: none;
            border-color: #FEE500;
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-shrink: 0;
        }

        .btn {
            padding: 10px 20px;
            border: 1px solid #e0e0e0;
            background: #fff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            border-color: #FEE500;
        }

        .btn-primary {
            background: #FEE500;
            border-color: #FEE500;
            color: #121212;
            font-weight: 600;
        }

        .btn-primary:hover {
            opacity: 0.8;
        }

        /* 커스텀 필드 */
        .custom-fields-list {
            margin-top: 20px;
            border-top: 1px solid #e0e0e0;
            padding-top: 20px;
        }

        .custom-fields-list h3 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #121212;
        }

        .custom-field-item {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }

        .custom-field-item input {
            flex: 1;
            padding: 8px;
            border: 1px solid #e0e0e0;
            font-size: 13px;
        }

        .custom-field-item input:focus {
            outline: none;
            border-color: #FEE500;
        }

        .custom-field-remove {
            padding: 8px 12px;
            background: #fff;
            border: 1px solid #e0e0e0;
            font-size: 13px;
            cursor: pointer;
            color: #999;
        }

        .custom-field-remove:hover {
            border-color: #FEE500;
            color: #121212;
        }

        .add-field-btn {
            padding: 8px;
            width: 100%;
            background: none;
            border: none;
            font-size: 13px;
            cursor: pointer;
            color: #007bff;
        }

        .add-field-btn:hover {
            text-decoration: underline;
            color: #007bff;
        }

        /* 커스텀 마커 */
        .custom-marker {
            font-size: 35px;
            line-height: 1;
        }

        .custom-marker.visited {
            opacity: 0.4;
        }

        .custom-marker-inner {
            display: block;
        }

        /* 팝업 스타일 */
        .leaflet-popup-content-wrapper {
            background: #fff;
            border: 1px solid #FEE500;
            border-radius: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .leaflet-popup-tip {
            background: #fff;
            border: 1px solid #FEE500;
            border-top: none;
            border-right: none;
        }

        .popup-content {
            min-width: 240px;
            padding: 4px;
        }

        .popup-title {
            font-size: 13px;
            font-weight: 600;
            color: #121212;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e0e0e0;
        }

        .popup-info {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .popup-info div {
            margin-bottom: 4px;
            display: flex;
            gap: 6px;
        }

        .popup-info .label {
            min-width: 60px;
            color: #999;
        }

        .popup-info a {
            color: #121212;
            text-decoration: none;
            border-bottom: 1px solid #e0e0e0;
        }

        .popup-info a:hover {
            border-bottom-color: #FEE500;
        }

        .popup-action {
            padding-top: 8px;
            border-top: 1px solid #e0e0e0;
        }

        .popup-btn {
            width: 100%;
            padding: 8px;
            background: #FEE500;
            color: #121212;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .popup-btn:hover {
            opacity: 0.8;
        }

        .popup-btn.visited {
            background: #fff;
            color: #121212;
            border: 1px solid #e0e0e0;
        }

        /* 로그 스타일 */
        .popup-logs {
            margin: 12px 0;
            padding-top: 12px;
            border-top: 1px solid #e0e0e0;
        }

        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .logs-title {
            font-size: 13px;
            font-weight: 600;
            color: #121212;
        }

        .log-add-btn {
            background: none;
            border: none;
            color: #007bff;
            font-size: 13px;
            cursor: pointer;
            padding: 2px 6px;
        }

        .log-add-btn:hover {
            text-decoration: underline;
        }

        .logs-list {
            max-height: 120px;
            overflow-y: auto;
        }

        .log-item {
            font-size: 13px;
            padding: 6px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .log-item:last-child {
            border-bottom: none;
        }

        .log-date {
            color: #999;
            margin-right: 8px;
        }

        .log-type {
            background: #FEE500;
            color: #121212;
            padding: 1px 6px;
            border-radius: 2px;
            font-size: 13px;
            margin-right: 6px;
        }

        .log-memo {
            color: #666;
            display: block;
            margin-top: 4px;
        }

        .log-delete {
            float: right;
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            font-size: 13px;
        }

        .log-delete:hover {
            color: #dc3545;
        }

        .no-logs {
            color: #999;
            font-size: 13px;
            text-align: center;
            padding: 10px 0;
        }

        /* 로그 추가 모달 */
        .log-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 10001;
        }

        .log-modal.active {
            display: flex;
        }

        .log-modal-content {
            background: #fff;
            width: 320px;
            padding: 20px;
        }

        .log-modal h3 {
            font-size: 13px;
            margin-bottom: 16px;
        }

        .log-types {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .log-type-btn {
            padding: 6px 12px;
            border: 1px solid #e0e0e0;
            background: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .log-type-btn:hover, .log-type-btn.active {
            background: #FEE500;
            border-color: #FEE500;
        }

        .log-memo-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #e0e0e0;
            font-size: 13px;
            margin-bottom: 12px;
            resize: none;
        }

        .log-modal-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        /* 사이드 패널 */
        .side-panel {
            position: absolute;
            top: 0;
            right: -360px;
            width: 360px;
            height: 100%;
            background: #fff;
            border-left: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transition: right 0.3s ease;
            box-shadow: -2px 0 8px rgba(0,0,0,0.1);
        }

        .side-panel.active {
            right: 0;
        }

        .side-panel-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .side-panel-header h2 {
            font-size: 16px;
            font-weight: 600;
        }

        .side-panel-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .side-panel-footer {
            padding: 16px 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="header">
                <div class="header-title-row">
                    <h1>영업 지도</h1>
                    <div class="header-buttons">
                        <span class="text-btn" onclick="openFieldsModal()">수정</span>
                        <span class="text-btn" onclick="openAddPanel()">추가</span>
                        <span class="text-btn" onclick="document.getElementById('excelUpload').click()">엑셀</span>
                        <input type="file" id="excelUpload" accept=".xlsx,.xls" style="display:none" onchange="uploadExcel(event)">
                    </div>
                </div>
                <div class="header-actions">
                    <div class="stats-row">
                        <div class="stats-inline">
                            <div class="stat-inline">
                                전체 <span id="totalCount">0</span>
                            </div>
                            <div class="stat-inline">
                                방문 <span id="visitedCount">0</span>
                            </div>
                            <div class="stat-inline">
                                미방문 <span id="notVisitedCount">0</span>
                            </div>
                            <div class="stat-inline" style="font-weight: 600;">
                                방문율 <span id="visitRate">0</span>%
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="filters">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">전체</button>
                    <button class="filter-btn" data-filter="visited">방문</button>
                    <button class="filter-btn" data-filter="not-visited">미방문</button>
                    <button class="filter-btn" id="viewportBtn" onclick="toggleViewportFilter()">📍 영역</button>
                </div>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="업체/회사명 검색" oninput="renderLocations()">
                </div>
            </div>

            <div class="locations" id="locationList"></div>
        </div>

        <div class="map-container">
            <div id="map"></div>
            
            <!-- 오른쪽 사이드 패널 -->
            <div class="side-panel" id="sidePanel">
                <div class="side-panel-header">
                    <h2 id="sidePanelTitle">업체 추가</h2>
                    <button class="modal-close" onclick="closeSidePanel()">×</button>
                </div>
                <div class="side-panel-body">
                    <input type="hidden" id="editingId">
                    <div class="form-group">
                        <label>업체명 *</label>
                        <input type="text" id="inputName" required>
                    </div>
                    <div class="form-group">
                        <label>회사명</label>
                        <input type="text" id="inputCompany">
                    </div>
                    <div class="form-group">
                        <label>사업자번호</label>
                        <input type="text" id="inputBusinessNo" oninput="formatBusinessNoInput(this)" placeholder="000-00-00000">
                    </div>
                    <div class="form-group">
                        <label>주소 *</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="inputAddress" required style="flex: 1;">
                            <button type="button" class="btn" onclick="searchCoordinates()" style="white-space: nowrap; padding: 10px 16px;">좌표 검색</button>
                        </div>
                        <div id="geocodeStatus" style="font-size: 13px; color: #999; margin-top: 4px;"></div>
                    </div>
                    <div class="form-group">
                        <label>전화번호</label>
                        <input type="text" id="inputPhone" oninput="formatPhoneNumber(this)">
                    </div>
                    <div class="form-group">
                        <label>이메일</label>
                        <input type="email" id="inputEmail">
                    </div>
                    <div class="form-group">
                        <label>홈페이지</label>
                        <input type="url" id="inputWebsite">
                    </div>
                    <div class="form-group">
                        <label>위도 / 경도 *</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="number" step="0.00000000000001" id="inputLat" required placeholder="37.546621" style="flex: 1;">
                            <input type="number" step="0.00000000000001" id="inputLng" required placeholder="127.076544" style="flex: 1;">
                        </div>
                    </div>
                    <div id="customFieldsInputs"></div>
                </div>
                <div class="side-panel-footer">
                    <button class="btn" onclick="closeSidePanel()">취소</button>
                    <button class="btn btn-primary" onclick="saveLocation()">저장</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 컬럼 관리 모달 -->
    <div class="modal" id="fieldsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>설정</h2>
                <button class="modal-close" onclick="closeFieldsModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="custom-fields-list" style="margin-top: 0; border-top: none; padding-top: 0;">
                    <h3>💾 데이터 백업</h3>
                    <div style="display: flex; gap: 8px; margin-bottom: 20px;">
                        <button class="btn" onclick="exportData()">내보내기 (JSON)</button>
                        <button class="btn" onclick="document.getElementById('importFile').click()">가져오기</button>
                        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
                    </div>
                </div>

                <div class="custom-fields-list" style="border-top: 1px solid #e0e0e0; padding-top: 20px;">
                    <h3>🔑 카카오 JavaScript 키</h3>
                    <div style="font-size: 13px; color: #666; margin-bottom: 12px; line-height: 1.6;">
                        주소로 정확한 좌표를 검색하려면 카카오 JavaScript 키가 필요합니다.<br>
                        <a href="https://developers.kakao.com" target="_blank" style="color: #007bff;">developers.kakao.com</a> → 내 애플리케이션 → 앱 키 → <strong>JavaScript 키</strong> 복사
                    </div>
                    <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                        <input type="text" id="kakaoJsKeyInput" placeholder="JavaScript 키 입력" 
                               style="flex: 1; padding: 10px; border: 1px solid #e0e0e0; font-size: 13px;">
                        <button class="btn btn-primary" onclick="saveKakaoJsKey()" style="white-space: nowrap;">저장</button>

        // 사업자번호 포맷 (000-00-00000)
        function formatBusinessNo(value) {
            if (!value) return '';
            const num = value.replace(/[^0-9]/g, '');
            if (num.length >= 10) {
                return num.slice(0, 3) + '-' + num.slice(3, 5) + '-' + num.slice(5, 10);
            } else if (num.length > 5) {
                return num.slice(0, 3) + '-' + num.slice(3, 5) + '-' + num.slice(5);
            } else if (num.length > 3) {
                return num.slice(0, 3) + '-' + num.slice(3);
            }
            return num;
        }

        // 사업자번호 입력 자동 포맷
        function formatBusinessNoInput(input) {
            const num = input.value.replace(/[^0-9]/g, '');
            input.value = formatBusinessNo(num);
        }

        // 전화번호 포맷 (표시용)
        function formatPhone(value) {
            if (!value) return '';
            const num = value.replace(/[^0-9]/g, '');
            
            if (num.startsWith('02')) {
                if (num.length <= 9) {
                    return num.slice(0, 2) + '-' + num.slice(2, 5) + '-' + num.slice(5);
                } else {
                    return num.slice(0, 2) + '-' + num.slice(2, 6) + '-' + num.slice(6, 10);
                }
            } else if (num.length === 8) {
                // 1588-0000 등 대표번호
                return num.slice(0, 4) + '-' + num.slice(4);
            } else if (num.length === 10) {
                return num.slice(0, 3) + '-' + num.slice(3, 6) + '-' + num.slice(6);
            } else if (num.length === 11) {
                return num.slice(0, 3) + '-' + num.slice(3, 7) + '-' + num.slice(7);
            }
            return value;
        }

        // 전화번호 자동 포맷
        function formatPhoneNumber(input) {
            let value = input.value.replace(/[^0-9]/g, '');
            let formatted = '';
            
            if (value.startsWith('02')) {
                // 서울 지역번호 02
                if (value.length <= 2) {
                    formatted = value;
                } else if (value.length <= 5) {
                    formatted = value.slice(0, 2) + '-' + value.slice(2);
                } else if (value.length <= 9) {
                    formatted = value.slice(0, 2) + '-' + value.slice(2, 5) + '-' + value.slice(5);
                } else {
                    formatted = value.slice(0, 2) + '-' + value.slice(2, 6) + '-' + value.slice(6, 10);
                }
            } else if (value.startsWith('010') || value.startsWith('011') || value.startsWith('016') || value.startsWith('017') || value.startsWith('018') || value.startsWith('019')) {
                // 휴대폰 번호
                if (value.length <= 3) {
                    formatted = value;
                } else if (value.length <= 7) {
                    formatted = value.slice(0, 3) + '-' + value.slice(3);
                } else {
                    formatted = value.slice(0, 3) + '-' + value.slice(3, 7) + '-' + value.slice(7, 11);
                }
            } else if (value.startsWith('070') || value.startsWith('080') || value.startsWith('050')) {
                // 인터넷전화, 수신자부담, 개인식별번호
                if (value.length <= 3) {
                    formatted = value;
                } else if (value.length <= 7) {
                    formatted = value.slice(0, 3) + '-' + value.slice(3);
                } else {
                    formatted = value.slice(0, 3) + '-' + value.slice(3, 7) + '-' + value.slice(7, 11);
                }
            } else if (value.startsWith('0')) {
                // 기타 지역번호 (031, 032, 033 등)
                if (value.length <= 3) {
                    formatted = value;
                } else if (value.length <= 6) {
                    formatted = value.slice(0, 3) + '-' + value.slice(3);
                } else if (value.length <= 10) {
                    formatted = value.slice(0, 3) + '-' + value.slice(3, 6) + '-' + value.slice(6);
                } else {
                    formatted = value.slice(0, 3) + '-' + value.slice(3, 7) + '-' + value.slice(7, 11);
                }
            } else {
                // 0으로 시작하지 않는 경우 (1588, 1577 등 대표번호)
                if (value.length <= 4) {
                    formatted = value;
                } else {
                    formatted = value.slice(0, 4) + '-' + value.slice(4, 8);
                }
            }
            
            input.value = formatted;
        }

        // 로그 관리 함수
        function getLogs(locationId) {
            const allLogs = JSON.parse(localStorage.getItem('locationLogs') || '{}');
            return allLogs[locationId] || [];
        }

        function saveLogs(locationId, logs) {
            const allLogs = JSON.parse(localStorage.getItem('locationLogs') || '{}');
            allLogs[locationId] = logs;
            localStorage.setItem('locationLogs', JSON.stringify(allLogs));
        }

        function renderLogs(locationId) {
            const logs = getLogs(locationId);
            if (logs.length === 0) {
                return '<div class="no-logs">아직 로그가 없습니다</div>';
            }
            return logs.map((log, index) => {
                // 날짜 형식 통일
                let displayDate = log.date;
                if (log.date && log.date.match(/^\d{1,2}\/\d{1,2}$/)) {
                    const [month, day] = log.date.split('/');
                    const year = new Date().getFullYear();
                    displayDate = `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
                }
                return `
                <div class="log-item">
                    <button class="log-delete" onclick="deleteLog(${locationId}, ${index})">×</button>
                    <span class="log-date">${displayDate}</span>
                    <span class="log-type">${log.type}</span>
                    ${log.memo ? `<span class="log-memo">${log.memo}</span>` : ''}
                </div>
            `}).join('');
        }

        function saveLog() {
            const locationId = parseInt(document.getElementById('logLocationId').value);

                alert('활동 유형을 선택해주세요.');

            const logs = getLogs(locationId);
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const date = String(today.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${date}`;
            
            logs.unshift({
                date: dateStr,
                type: selectedLogType,
                memo: memo
            });
            
            saveLogs(locationId, logs);

            // 해당 마커의 팝업 업데이트

        // 데이터 가져오기
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    if (data.locations) {
                        locations = data.locations;
                        localStorage.setItem('salesLocations', JSON.stringify(locations));
                    }
                    if (data.customFields) {
                        customFields = data.customFields;
                        localStorage.setItem('customFields', JSON.stringify(customFields));
                    }
                    if (data.logs) {
                        localStorage.setItem('locationLogs', JSON.stringify(data.logs));
                    }
                    if (data.visited) {
                        localStorage.setItem('visitedLocations', JSON.stringify(data.visited));
                    }
                    
                    alert('데이터를 불러왔습니다!');
                    location.reload();
                } catch (err) {
                    alert('파일을 읽을 수 없습니다.');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // 엑셀 대량 업로드
        async function uploadExcel(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheetName = workbook.SheetNames[0];
                    const sheet = workbook.Sheets[sheetName];
                    const rows = XLSX.utils.sheet_to_json(sheet);
                    
                    if (rows.length === 0) {
                        alert('엑셀에 데이터가 없습니다.');
                        return;
                    }
                    
                    let added = 0;
                    let failed = 0;
                    
                    for (const row of rows) {
                        const name = row['업체명'] || row['name'] || '';
                        const address = row['주소'] || row['address'] || '';
                        
                        if (!name || !address) {
                            failed++;
                            continue;
                        }
                        
                        let lat = parseFloat(row['위도'] || row['lat'] || 0);
                        let lng = parseFloat(row['경도'] || row['lng'] || 0);
                        
                        // 좌표가 없으면 카카오 API로 검색
                        if (!lat || !lng) {
                            const coords = await searchCoordsForExcel(address);
                            if (coords) {
                                lat = coords.lat;
                                lng = coords.lng;
                            } else {
                                failed++;
                                continue;
                            }
                        }
                        
                        const newLocation = {
                            id: nextId++,
                            name: name,
                            company: row['회사명'] || row['company'] || '',
                            businessNo: row['사업자번호'] || row['businessNo'] || '',
                            address: address,
                            phone: row['전화번호'] || row['phone'] || '',
                            email: row['이메일'] || row['email'] || '',
                            website: row['홈페이지'] || row['website'] || '',
                            lat: lat,
                            lng: lng,
                            customData: {}
                        };
                        
                        locations.push(newLocation);
                        added++;
                    }
                    
                    saveData();
                    renderLocations();
                    updateAllMarkers();
                    
                    alert(`완료! ${added}개 추가, ${failed}개 실패`);
                } catch (err) {
                    console.error(err);
                    alert('엑셀 파일을 읽을 수 없습니다.');
                }
            };
            reader.readAsArrayBuffer(file);
            event.target.value = '';
        }
        
        // 엑셀용 좌표 검색 (카카오 API)
        function searchCoordsForExcel(address) {
            return new Promise((resolve) => {
                if (!kakaoLoaded) {
                    resolve(null);
                    return;
                }
                
                const geocoder = new kakao.maps.services.Geocoder();
                geocoder.addressSearch(address, (result, status) => {
                    if (status === kakao.maps.services.Status.OK && result.length > 0) {
                        resolve({
                            lat: parseFloat(result[0].y),
                            lng: parseFloat(result[0].x)
                        });
                    } else {
                        // 키워드 검색 시도
                        const places = new kakao.maps.services.Places();
                        places.keywordSearch(address, (result, status) => {
                            if (status === kakao.maps.services.Status.OK && result.length > 0) {
                                resolve({
                                    lat: parseFloat(result[0].y),
                                    lng: parseFloat(result[0].x)
                                });
                            } else {
                                resolve(null);
                            }
                        });
                    }
                });
            });
        }

        function loadData() {
            const savedLocations = localStorage.getItem('salesLocations');
            const savedFields = localStorage.getItem('customFields');
            
            if (savedLocations) {
                locations = JSON.parse(savedLocations);
                // id가 null이거나 없는 항목 정리
                locations = locations.filter(l => l.id !== null && l.id !== undefined);
                locations.forEach((l, i) => {
                    if (l.id === null || l.id === undefined) {
                        l.id = i + 1;
                    }
                });
                if (locations.length > 0) {
                    nextId = Math.max(...locations.map(l => l.id || 0)) + 1;
                } else {
                    nextId = 1;
                }
            }
            
            if (savedFields) {
                customFields = JSON.parse(savedFields);
            }
        }

        function getVisitedStatus() {
            const visited = localStorage.getItem('visitedLocations');
            return visited ? JSON.parse(visited) : {};
        }

        function setVisitedStatus(locationId, isVisited) {
            const visited = getVisitedStatus();
            visited[locationId] = isVisited;
            localStorage.setItem('visitedLocations', JSON.stringify(visited));
            updateStats();
            renderLocations();
            updateMarkers();
        }

        function updateStats() {
            const visited = getVisitedStatus();
            const visitedCount = Object.values(visited).filter(v => v).length;
            const total = locations.length;
            const rate = total > 0 ? Math.round((visitedCount / total) * 100) : 0;
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('visitedCount').textContent = visitedCount;
            document.getElementById('notVisitedCount').textContent = total - visitedCount;
            document.getElementById('visitRate').textContent = rate;
        }

        function renderLocations() {
            const visited = getVisitedStatus();
            const container = document.getElementById('locationList');
            const searchQuery = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
            
            let filteredLocations = locations.filter(loc => {
                // 검색어 필터
                if (searchQuery) {
                    const nameMatch = (loc.name || '').toLowerCase().includes(searchQuery);
                    const companyMatch = (loc.company || '').toLowerCase().includes(searchQuery);
                    if (!nameMatch && !companyMatch) return false;
                }
                
                // 방문 상태 필터
                if (currentFilter === 'visited' && !visited[loc.id]) return false;
                if (currentFilter === 'not-visited' && visited[loc.id]) return false;
                
                // 지도 영역 필터
                if (viewportFilter && map) {
                    const bounds = map.getBounds();
                    const latlng = L.latLng(loc.lat, loc.lng);
                    if (!bounds.contains(latlng)) return false;
                }
                
                return true;
            });
            
            // 업체명 기준 오름차순 정렬
            filteredLocations.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ko'));

            container.innerHTML = filteredLocations.map(loc => {
                const isVisited = visited[loc.id];
                
                let customFieldsHtml = '';
                customFields.forEach(field => {
                    const value = loc.customData[field.key] || '';
                    if (value) {
                        customFieldsHtml += `<div><span class="label">${field.label}</span><span>${value}</span></div>`;
                    }
                });
                
                return `
                    <div class="location-card ${isVisited ? 'visited' : ''}" data-id="${loc.id}">
                        <div class="card-actions">
                            <button class="card-btn" onclick="openEditPanel(${loc.id}, event)" title="수정">✎</button>
                            <button class="card-btn" onclick="deleteLocation(${loc.id}, event)" title="삭제">×</button>
                        </div>
                        <div class="location-header">
                            <span class="location-name">${loc.name}</span>${loc.company ? `<span class="location-company">${loc.company}</span>` : ''}
                            <div class="visit-badge">${isVisited ? 'visited' : ''}</div>
                        </div>
                        <div class="location-info">
                            <div><span class="label">주소</span><span>${loc.address}</span></div>
                            ${loc.phone ? `<div><span class="label">전화</span><span>${formatPhone(loc.phone)}</span></div>` : ''}
                            ${loc.email ? `<div><span class="label">이메일</span><span>${loc.email}</span></div>` : ''}
                            ${customFieldsHtml}
                        </div>
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.location-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (!e.target.closest('.card-btn')) {
                        document.querySelectorAll('.location-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');
                        const id = parseInt(card.dataset.id);
                        focusLocation(id);
                    }
                });
            });
        }

        function toggleVisit(id) {
            const visited = getVisitedStatus();
            setVisitedStatus(id, !visited[id]);
        }

        function toggleViewportFilter() {
            viewportFilter = !viewportFilter;
            const btn = document.getElementById('viewportBtn');
            if (viewportFilter) {
                btn.style.background = '#FEE500';
                btn.style.color = '#000';
                btn.style.fontWeight = '600';
            } else {
                btn.style.background = '#fff';
                btn.style.color = '#666';
                btn.style.fontWeight = '500';
            }
            renderLocations();
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderLocations();
            });
        });

        function initMap() {
            map = L.map('map').setView([37.5665, 126.9780], 13);

            // 구글맵 스타일 베이스맵 (지하철 정보 포함)
            L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                attribution: '© Google Maps',
                maxZoom: 20
            }).addTo(map);

            // 지도 이동/줌 변경시 리스트 업데이트
            map.on('moveend', function() {
                if (viewportFilter) {
                    renderLocations();
                }
            });

            updateAllMarkers();
        }

        function updateAllMarkers() {
            Object.values(markers).forEach(marker => marker.remove());
            markers = {};

            const visited = getVisitedStatus();
            
            // 같은 위치 핀 분산을 위한 좌표 카운트
            const coordCount = {};
            locations.forEach(loc => {
                const key = `${loc.lat},${loc.lng}`;
                coordCount[key] = (coordCount[key] || 0) + 1;
            });
            const coordIndex = {};
            
            locations.forEach(location => {
                const isVisited = visited[location.id];
                
                // 같은 위치에 여러 핀이 있으면 살짝 분산
                const key = `${location.lat},${location.lng}`;
                coordIndex[key] = (coordIndex[key] || 0);
                const count = coordCount[key];
                let offsetLat = 0, offsetLng = 0;
                
                if (count > 1) {
                    const angle = (coordIndex[key] / count) * 2 * Math.PI;
                    const radius = 0.0002; // 약 20m 분산
                    offsetLat = Math.cos(angle) * radius;
                    offsetLng = Math.sin(angle) * radius;
                    coordIndex[key]++;
                }
                
                const customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="custom-marker ${isVisited ? 'visited' : ''}">
                             <span class="custom-marker-inner">🆘</span>
                           </div>`,
                    iconSize: [35, 35],
                    iconAnchor: [17, 35],
                    popupAnchor: [0, -35]
                });

                const marker = L.marker([location.lat + offsetLat, location.lng + offsetLng], {
                    icon: customIcon
                }).addTo(map);

                let customFieldsHtml = '';
                customFields.forEach(field => {
                    const value = (location.customData && location.customData[field.key]) || '';
                    if (value) {
                        customFieldsHtml += `<div><span class="label">${field.label}</span><span>${value}</span></div>`;
                    }
                });

                const popupContent = `
                    <div class="popup-content">
                        <div class="popup-title">${location.name}</div>
                        <div class="popup-info">
                            ${location.company ? `<div><span class="label">회사</span><span>${location.company}${location.businessNo ? ` <span style="color:#999">(${formatBusinessNo(location.businessNo)})</span>` : ''}</span></div>` : ''}
                            <div><span class="label">주소</span><span>${location.address}</span></div>
                            ${location.phone ? `<div><span class="label">전화</span><span><a href="tel:${location.phone.replace(/[^0-9]/g, '')}">${formatPhone(location.phone)}</a></span></div>` : ''}
                            ${location.email ? `<div><span class="label">이메일</span><span><a href="mailto:${location.email}">${location.email}</a></span></div>` : ''}
                            ${location.website ? `<div><span class="label">홈페이지</span><span><a href="${location.website}" target="_blank">${location.website}</a></span></div>` : ''}
                            ${customFieldsHtml}
                        </div>
                        <div class="popup-logs">
                            <div class="logs-header">
                                <span class="logs-title">활동 로그</span>
                                <button class="log-add-btn" onclick="openLogModal(${location.id})">+ 추가</button>
                            </div>
                            <div class="logs-list" id="logs-${location.id}">
                                ${renderLogs(location.id)}
                            </div>
                        </div>
                        <div class="popup-action">
                            <button class="popup-btn ${isVisited ? 'visited' : ''}" onclick="toggleVisitFromPopup(${location.id})">
                                ${isVisited ? '미방문으로 변경' : '방문완료'}
                            </button>
                        </div>
                    </div>
                `;

                marker.bindPopup(popupContent);
                markers[location.id] = marker;
            });
        }

        function updateMarkers() {
            updateAllMarkers();
        }

        function focusLocation(id) {
            const location = locations.find(l => l.id === id);
            const marker = markers[id];
            
            console.log('focusLocation 호출:', id, location, marker, map);
            
            if (location && map) {
                map.setView([location.lat, location.lng], 16, {
                    animate: true,
                    duration: 0.5
                });
                
                if (marker) {
                    setTimeout(() => {
                        marker.openPopup();
                    }, 300);
                }
            }
        }

        function toggleVisitFromPopup(id) {
            toggleVisit(id);
            updateAllMarkers();
            focusLocation(id);
        }

        // 카카오 JavaScript 키 저장
        function saveKakaoJsKey() {
            const key = document.getElementById('kakaoJsKeyInput').value.trim();
            const statusDiv = document.getElementById('jsKeyStatus');
            
            if (key) {
                localStorage.setItem('kakaoJsKey', key);
                statusDiv.textContent = '✓ 저장되었습니다! 카카오맵 SDK를 로드합니다...';
                statusDiv.style.color = '#28a745';
                loadKakaoSdk(key);
            } else {
                localStorage.removeItem('kakaoJsKey');
                statusDiv.textContent = '키가 제거되었습니다.';
                statusDiv.style.color = '#999';
            }
        }
        
        // 카카오맵 SDK 동적 로드
        let kakaoLoaded = false;
        function loadKakaoSdk(key) {
            if (kakaoLoaded) return;
            
            const script = document.createElement('script');
            script.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${key}&libraries=services&autoload=false`;
            script.onload = () => {
                kakao.maps.load(() => {
                    kakaoLoaded = true;
                    console.log('카카오맵 SDK 로드 완료');
                    const statusDiv = document.getElementById('jsKeyStatus');
                    if (statusDiv) {
                        statusDiv.textContent = '✓ 카카오맵 SDK 로드 완료!';
                        statusDiv.style.color = '#28a745';
                    }
                });
            };
            script.onerror = () => {
                console.error('카카오맵 SDK 로드 실패');
                const statusDiv = document.getElementById('jsKeyStatus');
                if (statusDiv) {
                    statusDiv.textContent = '⚠ SDK 로드 실패. 키를 확인해주세요.';
                    statusDiv.style.color = '#dc3545';
                }
            };
            document.head.appendChild(script);
        }
        
        // 페이지 로드 시 저장된 키로 SDK 로드
        (function() {
            const savedKey = localStorage.getItem('kakaoJsKey');
            if (savedKey) {
                loadKakaoSdk(savedKey);
            }
        })();

        // 주소로 정확한 좌표 검색
        async function searchCoordinates() {
            const address = document.getElementById('inputAddress').value.trim();
            const statusDiv = document.getElementById('geocodeStatus');
            
            if (!address) {
                statusDiv.textContent = '주소를 입력해주세요.';
                statusDiv.style.color = '#dc3545';
                return;
            }
            
            const kakaoKey = localStorage.getItem('kakaoJsKey');
            
            if (!kakaoKey) {
                statusDiv.innerHTML = '카카오 JavaScript 키가 필요합니다. <a href="javascript:void(0)" onclick="openFieldsModal()" style="color: #007bff;">설정</a>에서 입력해주세요.';
                statusDiv.style.color = '#dc3545';
                return;
            }
            
            if (!kakaoLoaded) {
                statusDiv.textContent = 'SDK 로드 중... 잠시 후 다시 시도해주세요.';
                statusDiv.style.color = '#ff9800';
                loadKakaoSdk(kakaoKey);
                return;
            }
            
            statusDiv.textContent = '검색 중...';
            statusDiv.style.color = '#999';
            
            try {
                const geocoder = new kakao.maps.services.Geocoder();
                
                // 먼저 주소 검색
                geocoder.addressSearch(address, (result, status) => {
                    if (status === kakao.maps.services.Status.OK && result.length > 0) {
                        const lat = parseFloat(result[0].y);
                        const lng = parseFloat(result[0].x);
                        
                        document.getElementById('inputLat').value = lat;
                        document.getElementById('inputLng').value = lng;
                        
                        statusDiv.textContent = '✓ 좌표를 찾았습니다!';
                        statusDiv.style.color = '#28a745';
                    } else {
                        // 주소 검색 실패시 키워드 검색 시도
                        const places = new kakao.maps.services.Places();
                        places.keywordSearch(address, (result, status) => {
                            if (status === kakao.maps.services.Status.OK && result.length > 0) {
                                const lat = parseFloat(result[0].y);
                                const lng = parseFloat(result[0].x);
                                
                                document.getElementById('inputLat').value = lat;
                                document.getElementById('inputLng').value = lng;
                                
                                statusDiv.textContent = '✓ 좌표를 찾았습니다! (' + result[0].place_name + ')';
                                statusDiv.style.color = '#28a745';
                            } else {
                                statusDiv.textContent = '⚠ 검색 결과가 없습니다.';
                                statusDiv.style.color = '#ff9800';
                            }
                        });
                    }
                });
            } catch (error) {
                console.error('좌표 검색 오류:', error);
                statusDiv.textContent = '오류가 발생했습니다.';
                statusDiv.style.color = '#dc3545';
            }
        }

        // 업체 추가/수정 사이드 패널
        function openAddPanel() {
            editingLocationId = null;
            document.getElementById('sidePanelTitle').textContent = '업체 추가';
            clearLocationForm();
            renderCustomFieldInputs();
            document.getElementById('sidePanel').classList.add('active');
        }

        function openEditPanel(id, event) {
            event.stopPropagation();
            editingLocationId = id;
            const location = locations.find(l => l.id === id);
            
            if (!location) return;
            
            document.getElementById('sidePanelTitle').textContent = '업체 수정';
            document.getElementById('inputName').value = location.name || '';
            document.getElementById('inputCompany').value = location.company || '';
            document.getElementById('inputBusinessNo').value = location.businessNo || '';
            document.getElementById('inputAddress').value = location.address || '';
            document.getElementById('inputPhone').value = location.phone || '';
            document.getElementById('inputEmail').value = location.email || '';
            document.getElementById('inputWebsite').value = location.website || '';
            document.getElementById('inputLat').value = location.lat || '';
            document.getElementById('inputLng').value = location.lng || '';
            
            renderCustomFieldInputs(location.customData);
            document.getElementById('sidePanel').classList.add('active');
        }

        function closeSidePanel() {
            document.getElementById('sidePanel').classList.remove('active');
            clearLocationForm();
        }

        function clearLocationForm() {
            document.getElementById('inputName').value = '';
            document.getElementById('inputCompany').value = '';
            document.getElementById('inputBusinessNo').value = '';
            document.getElementById('inputAddress').value = '';
            document.getElementById('inputPhone').value = '';
            document.getElementById('inputEmail').value = '';
            document.getElementById('inputWebsite').value = '';
            document.getElementById('inputLat').value = '';
            document.getElementById('inputLng').value = '';
        }

        function renderCustomFieldInputs(data = {}) {
            const container = document.getElementById('customFieldsInputs');
            container.innerHTML = customFields.map(field => `
                <div class="form-group">
                    <label>${field.label}</label>
                    <input type="text" id="custom_${field.key}" value="${data[field.key] || ''}">
                </div>
            `).join('');
        }

        function saveLocation() {
            const name = document.getElementById('inputName').value.trim();
            const address = document.getElementById('inputAddress').value.trim();
            const latInput = document.getElementById('inputLat').value.trim();
            const lngInput = document.getElementById('inputLng').value.trim();
            const lat = parseFloat(latInput);
            const lng = parseFloat(lngInput);

            // 더 자세한 유효성 검사
            if (!name) {
                alert('업체명을 입력해주세요.');
                return;
            }
            if (!address) {
                alert('주소를 입력해주세요.');
                return;
            }
            if (!latInput || isNaN(lat)) {
                alert('위도를 올바르게 입력해주세요.\n예: 37.546621');
                return;
            }
            if (!lngInput || isNaN(lng)) {
                alert('경도를 올바르게 입력해주세요.\n예: 127.076544');
                return;
            }

            const customData = {};
            customFields.forEach(field => {
                const value = document.getElementById(`custom_${field.key}`).value.trim();
                if (value) customData[field.key] = value;
            });

            const locationData = {
                name: name,
                company: document.getElementById('inputCompany').value.trim(),
                businessNo: document.getElementById('inputBusinessNo').value.trim(),
                address: address,
                phone: document.getElementById('inputPhone').value.trim(),
                email: document.getElementById('inputEmail').value.trim(),
                website: document.getElementById('inputWebsite').value.trim(),
                lat: lat,
                lng: lng,
                customData: customData
            };

            if (editingLocationId) {
                const index = locations.findIndex(l => l.id === editingLocationId);
                if (index !== -1) {
                    locations[index] = { ...locations[index], ...locationData };
                }
            } else {
                locations.push({ id: nextId++, ...locationData });
            }

            saveData();
            updateStats();
            renderLocations();
            updateAllMarkers();
            closeSidePanel();
        }

        function deleteLocation(id, event) {
            event.stopPropagation();
            if (confirm('이 업체를 삭제하시겠습니까?')) {
                locations = locations.filter(l => l.id !== id);
                
                const visited = getVisitedStatus();
                delete visited[id];
                localStorage.setItem('visitedLocations', JSON.stringify(visited));
                
                saveData();
                updateStats();
                renderLocations();
                updateAllMarkers();
            }
        }

        // 컬럼 관리 모달
        function openFieldsModal() {
            // 저장된 카카오 JavaScript 키 표시
            const savedKey = localStorage.getItem('kakaoJsKey') || '';
            document.getElementById('kakaoJsKeyInput').value = savedKey;
            
            const statusDiv = document.getElementById('jsKeyStatus');
            if (savedKey && kakaoLoaded) {
                statusDiv.textContent = '✓ 카카오맵 SDK 로드됨';
                statusDiv.style.color = '#28a745';
            } else if (savedKey) {
                statusDiv.textContent = 'SDK 로드 중...';
                statusDiv.style.color = '#ff9800';
            } else {
                statusDiv.textContent = '';
            }
            
            renderCustomFieldsList();
            document.getElementById('fieldsModal').classList.add('active');
        }

        function closeFieldsModal() {
            document.getElementById('fieldsModal').classList.remove('active');
        }

        function renderCustomFieldsList() {
            const container = document.getElementById('customFieldsList');
            container.innerHTML = customFields.map((field, index) => `
                <div class="custom-field-item">
                    <input type="text" value="${field.label}" 
                           onchange="updateFieldLabel(${index}, this.value)"
                           placeholder="필드명">
                    <button class="custom-field-remove" onclick="removeCustomField(${index})">삭제</button>
                </div>
            `).join('');
        }

        function addCustomField() {
            const key = 'field_' + Date.now();
            customFields.push({ key: key, label: '새 필드' });
            renderCustomFieldsList();
        }

        function updateFieldLabel(index, label) {
            if (customFields[index]) {
                customFields[index].label = label;
            }
        }

        function removeCustomField(index) {
            if (confirm('이 필드를 삭제하시겠습니까?')) {
                const field = customFields[index];
                customFields.splice(index, 1);
                
                locations.forEach(loc => {
                    if (loc.customData && loc.customData[field.key]) {
                        delete loc.customData[field.key];
                    }
                });
                
                renderCustomFieldsList();
            }
        }

        function saveCustomFields() {
            saveData();
            renderLocations();
            updateAllMarkers();
            closeFieldsModal();
        }

        // 초기화
        window.onload = () => {
            loadData();
            updateStats();
            renderLocations();
            initMap();
        };

        // 모달 외부 클릭시 닫기
        document.getElementById('fieldsModal').addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) {
                closeFieldsModal();
            }
        });

        document.getElementById('logModal').addEventListener('click', (e) => {
            if (e.target.classList.contains('log-modal')) {
                closeLogModal();
            }
        });
    </script>
</body>
</html>
